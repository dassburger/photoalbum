# Deployment-specific configuration for `prep`.
#
# Copy this file to `prep.toml` (gitignored) and fill in real values for your
# deployment. `prep.toml` is read by prep/cli.py.

# Public domain name the site is served under (used for Caddy's automatic
# HTTPS / Let's Encrypt certificate issuance).
site_domain = "photos.example.com"

# Email address Let's Encrypt uses for expiry/revocation notices.
acme_email = "you@example.com"

# Path to the root of the photo archive, as `prep` itself sees it. Since
# `prep` only ever runs inside its own container (see prep/Dockerfile), this
# is the *container-internal* mount path from docker-compose.yml -- the
# same path the `caddy` service mounts the real archive at -- not the real
# host-side absolute path (that's docker-compose.yml's PICTURES_ROOT
# environment variable instead; see its comments).
pictures_root = "/pictures"
